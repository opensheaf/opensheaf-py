name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Python 3.9 (still the system Python of macOS) is no longer
          # available on the newest Ubuntu image
          - { python: "3.9", os: ubuntu-22.04 }
          - { python: "3.13", os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements-literate.txt
      - name: the files are tangled from literate/
        run: literate tangle --check
      - run: pip install ".[test]"
      - run: pytest -q
      - run: osheaf --version
  weave:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-literate.txt
      - run: literate weave --out site --branch "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: literate-site
          path: site
