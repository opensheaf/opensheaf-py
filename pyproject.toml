[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "opensheaf"
version = "0.1.0"
description = "Tools for OpenSheaf archives of scholarly documents (OCFL storage, DataCite metadata, collections)"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Massimiliano Gubinelli" }]
keywords = ["OpenSheaf", "OCFL", "DataCite", "archive", "preprints", "TeXmacs", "Zenodo", "arXiv"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = ["pyyaml>=6", "pynacl>=1.5"]

[project.optional-dependencies]
validate = ["jsonschema>=4", "rfc3986-validator>=0.1", "ocfl-py>=2.1"]
keys = ["keyring>=24"]
zenodo = ["keyring>=24"]
test = ["pytest", "jsonschema>=4", "rfc3986-validator>=0.1", "ocfl-py>=2.1"]

[project.scripts]
osheaf = "opensheaf.cli:main"
opensheaf = "opensheaf.cli:main"

[project.urls]
Homepage = "https://opensheaf.org"
Source = "https://github.com/opensheaf/opensheaf-py"
Specification = "https://opensheaf.org/opensheaf-specification-0.2.html"

[tool.setuptools.package-data]
opensheaf = ["schemas/*.json", "templates/*"]
